data:
  perception_file: data/raw/perception_log.csv
  telemetry_file: data/raw/telemetry_log.csv

sensor:
  rotation_deg: 180.0

dbscan:
  eps_m: 1.0
  min_samples: 4

preprocessing:
  min_confidence: 0.0

output:
  directory: outputs

# PROPOSED / ASSUMED PARAMETERS FOR EWMVC UNCERTAINTY PROPAGATION & GRAPH
# Note: These values are design parameters / configuration assumptions,
# not measured dataset values.
ewmvc:
  uncertainty:
    sigma_sensor_x: 0.10     # Sensor relative X standard deviation (m)
    sigma_sensor_y: 0.10     # Sensor relative Y standard deviation (m)
    sigma_pose_x: 0.05       # Vehicle pose X standard deviation (m)
    sigma_pose_y: 0.05       # Vehicle pose Y standard deviation (m)
    sigma_pose_yaw: 0.0174533 # Vehicle heading yaw standard deviation (rad, ~1.0 deg)

  graph:
    chi_square_threshold: 5.991  # 95% chi-square threshold for 2 degrees of freedom (theoretical)
    candidate_radius_m: 1.5      # Computational pre-filter spatial radius (m)

  entropy:
    num_angular_bins: 8          # 45 deg per bin (360 deg total)

  geometry:
    sigma0_m: 0.75               # Design scale parameter for RMS spatial dispersion (m)

  persistence:
    expected_duration_s: 10.0    # Design scale parameter for expected temporal persistence (seconds)

  diversity:
    saturation_baseline_m: 5.0   # Design scale parameter for vehicle displacement baseline saturation (m)

  consensus:
    weights:
      entropy: 0.30
      geometry: 0.30
      diversity: 0.20
      persistence: 0.20
    acceptance_threshold: 0.60   # Proposed diagnostic candidate acceptance threshold

  track_reconstruction:
    min_forward_distance_m: 0.0
    max_forward_distance_m: 60.0
    min_lateral_distance_m: 0.5
    max_lateral_distance_m: 15.0
    spline_degree: 3
    spline_samples: 200







